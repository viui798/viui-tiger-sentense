#下面的 #号 是注释符，注释了就无效了，删掉即可生效

patch:
  translator/dictionary: tiger.extended #引入增补自定词典，这个不要改动
  #translator/enable_completion: true # 编码提示，默认关闭，删掉行首的#号，即可开启
  #speller/auto_select_pattern: ^;\w+|^\w{4}$  # 四码上屏功能，删掉行首的#号，即可开启
  #speller/alphabet: "['zyxwvutsrqponmlkjihgfedcba]" # 取消分号引导的快符功能（分号不作码元），删掉行首#号即可生效
  #style/mark_text: " " #编号前标志，这里是空格，可在引号里可以自己加东西替换，如 "😅"
  #style/layout/border_width: 2 #边框宽度，默认是0
  #style/layout/border_height: 2 #边框高度，默认是0

  menu/page_size: 9 # 自定义候选个数，可修改。若要改成5个，行首加上#号注释即可（Rime默认就是5个）
  #style/horizontal: true # 默认是false竖排显示，删掉行首的#号，可横排显示（横排建议把上面这行注释掉）
  #style/layout/candidate_spacing: 17 #候选框改为横排后,增加 候选与候选 的间距
  #style/layout/hilite_spacing: 8  #候选框改为横排后,增加 标号与候选 的间距
  #style/layout/min_width: 85  #候选框改为横排后,增加最小宽度
  #style/layout/max_width: 1200 #候选框改为横排后，限制最大宽度，超长自动换行
  # 横排显示建议把下面这行也注释掉，换成阿拉伯数字标号
  menu/alternative_select_labels: [ ㊀, ㊁, ㊂, ㊃, ㊄, ㊅, ㊆, ㊇, ㊈ ]  # 自定义候选序号显示符，可自定修改，如要显示阿拉伯数字，直接注释掉这行（在前面加#号）
  # 以下是备选样式（自行删除#号即可生效，只能生效一种）
  #menu/alternative_select_labels: [ ①,②,③,④,⑤,⑥,⑦,⑧,⑨,⑩ ]
  #menu/alternative_select_labels: [ ❶,❷,❸,❹,❺,❻,❼,❽,❾,❿ ]
  #menu/alternative_select_labels: [ ⓵,⓶,⓷,⓸,⓹,⓺,⓻,⓼,⓽,⓾ ]
  #menu/alternative_select_labels: [ ㊀,㊁,㊂,㊃,㊄,㊅,㊆,㊇,㊈,㊉ ]
  #menu/alternative_select_labels: [ ㈠,㈡,㈢,㈣,㈤,㈥,㈦,㈧,㈨,㈩ ]
  #menu/alternative_select_labels: [ 🀇,🀈,🀉,🀊,🀋,🀌,🀍,🀎,🀏,🀄 ]
  #menu/alternative_select_labels: [ Ⅰ,Ⅱ,Ⅲ,Ⅳ,Ⅴ,Ⅵ,Ⅶ,Ⅷ,Ⅸ,Ⅹ ]
  #menu/alternative_select_labels: [ ⅰ,ⅱ,ⅲ,ⅳ,ⅴ,ⅵ,ⅶ,ⅷ,ⅸ,ⅹ ]
  #menu/alternative_select_labels: [ Ⓐ,Ⓑ,Ⓒ,Ⓓ,Ⓔ,Ⓕ,Ⓖ,Ⓗ,Ⓘ,Ⓙ ]
  #menu/alternative_select_labels: [ ⓐ,ⓑ,ⓒ,ⓓ,ⓔ,ⓕ,ⓖ,ⓗ,ⓘ,ⓙ ]

  #style/preedit_type: preview # 嵌入首选项内容(字词)。有4个选项可设：input 嵌入输入码 | composition 嵌入编码 | preview 嵌入首选项 | preview_all 嵌入全部内容 
  #style/layout/margin_y : -1 # 启用后可隐藏候选框(盲打)，建议配合上面的嵌入首选项，一起使用

  #style/inline_preedit: false # 嵌入编码模式，默认是true开启，若想关闭，取消注释即可（删除前面的#号）

  # 去掉圆角 新小狼毫（Win）
  #style/layout/corner_radius: 0 #候选圆角
  #style/layout/round_corner: 0 #高亮圆角

  # 竖排候选框超时长自动倒序
  #style/vertical_auto_reverse: false # 默认启用，若想关闭，将该行行首的#删掉

  # #候选字体
  #style/font_face: "Consolas, Segoe UI Emoji, Noto Color Emoji, LXGW WenKai GB Screen, SimSun, SimSun-ExtB, SimSun-ExtG, TH-Tshyn-P0, TH-Tshyn-P1, TH-Tshyn-P2, TH-Tshyn-P16"
  #style/font_point: 15 #主字体字号
  # #滤镜内容字体
  #style/comment_font_face: "Consolas, Segoe UI Emoji, Noto Color Emoji, TumanPUA, LXGW WenKai GB Screen, SimSun, SimSun-ExtB, SimSun-ExtG, TH-Tshyn-P0, TH-Tshyn-P1, TH-Tshyn-P2, TH-Tshyn-P16"
  #style/comment_font_point: 15 # 滤镜内容字号
  # #候选前编号标志字体
  #style/label_font_face: "LXGW WenKai GB Screen, SimSun, SimSun-ExtB, SimSun-ExtG, TH-Tshyn-P0, TH-Tshyn-P1, TH-Tshyn-P2, TH-Tshyn-P16"
  #style/label_font_point: 15 #候选前编号标志字号


  # 去除拼音滤镜的括号，如对括号有需求，可在下面5行前面加上#号注释掉
  #pinyin/comment_format:
   #- 'xform/&nbsp;/ /'
   #- 'xform/^/ /'
   #- 'xform/（//'
   #- 'xform/）//'
  # 也可自己把 （ 替换成别的，比如 'xform/（/〔/'

  # 让【 】可以直接上屏（对应的重复上屏的功能也没了）
  #speller/alphabet: ";'zyxwvutsrqponmlkjihgfedcba"

  # ---- 拼音反查模块（万象虎）----
  # 小鹤双拼（默认打法）。tag 用 yin_flypy 而不是 yin_add_user：
  # 见 lua/yin_pick.lua 顶部注释——否则小鹤翻译器会连其他打法的编码段一起响应。
  yin_add_user:
    tag: yin_flypy
    dictionary: wanxiang_pro
    initial_quality: -1
    user_dict: zc
    enable_completion: true
    enable_user_dict: true
    spelling_hints: 50
    comment_format:
    prefix: "'"
    suffix: "`"
    tips: "〔音〕"
    extra_tags: [ yin_add_user ]

  # ---- 拼音反查：打法切换（同一时间只启用一种）----
  # 五份拼写索引都在部署时一次生成，共用同一张词库表：
  #   wanxiang_pro（小鹤双拼，带辅助码）/ _qp（全拼）/ _zrm（自然码）
  #   / _mspy（微软双拼）/ _sogou（搜狗双拼）
  # 运行时由 lua/yin_pick.lua 按 yin_scheme 开关，把反查分段的 tag 换成选中打法的 tag，
  # 所以同一时间只有对应的那一个翻译器会响应；切换立即生效、**不需要重新部署**。
  # 切换命令：/flypy（小鹤，默认）/pinyin（全拼）/zrm（自然码）/mspy（微软）/sogou（搜狗）
  #
  # 注意：翻译器与 affix_segmentor 共用同一个命名空间（都叫 yin_qp 等），
  #      所以 tag/prefix/suffix/tips 与 dictionary/prism 写在同一个配置块里；
  #      extra_tags 让切出来的编码段同时带上 yin_add_user，
  #      供 lua/chaifen.lua、lua/db.lua 判断「这是反查」用。
  engine/translators/@before1: script_translator@yin_qp
  yin_qp:
    tag: yin_qp
    dictionary: wanxiang_pro
    prism: wanxiang_pro_qp
    initial_quality: -1
    user_dict: zc
    enable_completion: true
    enable_user_dict: true
    spelling_hints: 50
    comment_format:
    prefix: "'"
    suffix: "`"
    tips: "〔音·全拼〕"
    extra_tags: [ yin_add_user ]

  engine/translators/@before2: script_translator@yin_zrm
  yin_zrm:
    tag: yin_zrm
    dictionary: wanxiang_pro
    prism: wanxiang_pro_zrm
    initial_quality: -1
    user_dict: zc
    enable_completion: true
    enable_user_dict: true
    spelling_hints: 50
    comment_format:
    prefix: "'"
    suffix: "`"
    tips: "〔音·自然码〕"
    extra_tags: [ yin_add_user ]

  engine/translators/@before3: script_translator@yin_mspy
  yin_mspy:
    tag: yin_mspy
    dictionary: wanxiang_pro
    prism: wanxiang_pro_mspy
    initial_quality: -1
    user_dict: zc
    enable_completion: true
    enable_user_dict: true
    spelling_hints: 50
    comment_format:
    prefix: "'"
    suffix: "`"
    tips: "〔音·微软〕"
    extra_tags: [ yin_add_user ]

  engine/translators/@before4: script_translator@yin_sogou
  yin_sogou:
    tag: yin_sogou
    dictionary: wanxiang_pro
    prism: wanxiang_pro_sogou
    initial_quality: -1
    user_dict: zc
    enable_completion: true
    enable_user_dict: true
    spelling_hints: 50
    comment_format:
    prefix: "'"
    suffix: "`"
    tips: "〔音·搜狗〕"
    extra_tags: [ yin_add_user ]
