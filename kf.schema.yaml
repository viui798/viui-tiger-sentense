schema:
  schema_id: kf
  name: 快符
  version: "0.1"
  description: |
    快符：分号引导（;a…;z）或 o 引导（oq…om）的符号快捷输入。
  dependencies: []

engine:
  processors:
    - ascii_composer
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;"
  delimiter: " "
  max_code_length: 2
  auto_select: true
  auto_select_pattern: "^[;o]\\w+$"

translator:
  dictionary: kf
  enable_user_dict: false
  enable_sentence: false
  enable_encoder: false
  enable_completion: false