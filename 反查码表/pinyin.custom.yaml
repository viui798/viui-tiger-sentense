# ============================================================
# 拼音拼写运算 —— pinyin.custom.yaml
# ------------------------------------------------------------
# 作用：定义拼音方案的拼写运算（speller/algebra），三选一。
# 切换：同一时间只留一行生效——当前行加行首 # 注释掉，
#       目标行删掉行首 #。
#
#   全拼+简拼：拼音打字与 ` 反查都支持简拼（bs → 半生）
#   自然码 / 小鹤：反查收双拼码；双拼码位与简拼码位冲突
#   （3 字母时 kj'x 会被切成 k'jx），故不带简拼
#   —— 全拼+简拼 与 双拼反查 只能二选一
#
# 改完【重新部署】生效。
# ============================================================
### patch下方的三行依次为全拼、自然码、小鹤，三选一
patch:
  speller/algebra: ["abbrev/^([a-z]).+$/$1/", "abbrev/^([zcs]h).+$/$1/"]   # 全拼+简拼（默认）
